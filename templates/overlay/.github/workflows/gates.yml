name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      # a11y + visual gates (Playwright starts the server via webServer config)
      - run: npm run gate:a11y
      - run: npm run gate:visual

      # performance/SEO/best-practices gate (LHCI starts its own server)
      - run: npm run gate:perf
